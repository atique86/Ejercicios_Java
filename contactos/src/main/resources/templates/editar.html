<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecera::cabecera-seccion(titulo='Editar Contacto')}">
</head>
<body>
<!--DIV del menú de navegación-->
<div th:replace="~{fragmentos/navegacion::navegacion-seccion}"></div>
<div class="container">
  <div class="container text-center my-4">
    <h3>Editar contacto</h3>
  </div>
</div>
<div class="container">
  <form action="/editar" th:object="${contacto}" method="post">
    <input type="hidden" th:field="*{idContacto}"/>
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" name="nombre" required th:field="*{nombre}">
    </div>
    <div class="mb-3">
      <label for="celular" class="form-label">Celular</label>
      <input type="text" class="form-control" id="celular" name="celular" required pattern="[0-9]{10}"
             title="El número debe tener exactamente 10 dígitos" th:field="*{celular}">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" required th:field="*{email}">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-warning btn-sm me-3">Editar</button>
      <a href="/" class="btn btn-danger btn-sm">Regresar</a>
    </div>

  </form>
</div>
<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"/>
</body>
</html>
